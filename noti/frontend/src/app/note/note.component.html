<div class="w-full h-screen flex flex-col overflow-hidden relative"
     [style.background-color]="note()?.color || '#e8e0d5'"
     [ngClass]="'mode-' + (note()?.mode || 'list')"
     (contextmenu)="onRightClick($event)"
     (click)="closeAll()">

  <div class="flex items-center justify-between px-3 py-1.5 shrink-0 shadow-sm z-10 group"
        [style.background-color]="note()?.accentColor || '#4a3a3a'"
        style="color: #f2ebe1; --wails-draggable: drag; user-select: none;">

    <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition-opacity"
         style="--wails-draggable: no-drag;"
         (click)="showTimer.set(true); $event.stopPropagation()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 hover:opacity-100 transition-opacity cursor-pointer">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span class="text-sm font-semibold tracking-widest">{{ timerDisplay }}</span>
    </div>

    <div class="flex items-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity" style="--wails-draggable: no-drag;">

      <button class="sync-status hover:opacity-70 transition-opacity outline-none"
              (click)="forceSync(); $event.stopPropagation()"
              title="Force Sync to Google Drive">
        <svg *ngIf="isSaving" class="spin-icon animate-spin" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
        </svg>
        <svg *ngIf="!isSaving" class="check-icon" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </button>

      <button (click)="onRightClick($event)" class="hover:opacity-70 transition-opacity outline-none" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <button (click)="togglePin()" [style.opacity]="note()?.pinned ? '1' : '0.5'" class="hover:opacity-100 transition-opacity outline-none" title="Pin Note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.43l-3.41-1.71a2 2 0 0 1-1.11-1.43V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v6.67a2 2 0 0 1-1.11 1.43l-3.41 1.71A2 2 0 0 0 5 15.24Z"></path>
        </svg>
      </button>

      <button (click)="closeNote()" class="hover:text-red-300 transition-colors outline-none" title="Hide Note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto px-5 py-4 text-[#4a3a3a]">
    <tiptap-editor [editor]="editor"></tiptap-editor>
  </div>

  @if (showTimer()) {
    <div class="absolute top-10 left-3 z-50 w-44 rounded-lg shadow-xl py-3 flex flex-col"
         style="background-color: #e8e0d5; border: 1px solid #cbbdbd;"
         (click)="$event.stopPropagation()">

      <div class="text-center text-xs font-semibold text-[#f2ebe1] uppercase tracking-wider py-1 mx-3 rounded" style="background-color: #875c5c;">Timer (Hr : Min)</div>

      <div class="flex justify-center items-center py-4 text-3xl font-light text-[#4a3a3a] tracking-widest">

        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="2"
          [(ngModel)]="inputHr"
          (blur)="formatInput('hr')"
          (input)="onHrInput($event, minInput)"
          (keypress)="($event.charCode >= 48 && $event.charCode <= 57)"
          class="w-16 bg-transparent text-right outline-none border-none p-0 focus:ring-0 appearance-none selection:bg-[#875c5c]/20"
        >

        <span class="mx-1 mb-1">:</span>

        <input
          #minInput
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="2"
          [(ngModel)]="inputMin"
          (blur)="formatInput('min')"
          (keypress)="($event.charCode >= 48 && $event.charCode <= 57)"
          class="w-16 bg-transparent text-left outline-none border-none p-0 focus:ring-0 appearance-none selection:bg-[#875c5c]/20"
        >
      </div>

      <div class="flex justify-center gap-2 px-3">
        <button class="px-4 py-1.5 text-xs text-[#f2ebe1] rounded hover:opacity-90" style="background-color: #875c5c;" (click)="showTimer.set(false)">Cancel</button>
        <button class="px-4 py-1.5 text-xs text-[#f2ebe1] rounded hover:opacity-90" style="background-color: #875c5c;" (click)="startCountdown()">OK</button>
      </div>
    </div>
  }
</div>
