<div class="h-full w-full flex flex-col items-center justify-center relative group">

  <div *ngIf="isEditing" class="flex flex-col items-center justify-center w-full h-full p-4 border-2 border-dashed border-gray-200 rounded-xl hover:border-blue-400 transition-colors bg-gray-50">
    <div class="text-3xl mb-2">✨</div>
    <span class="text-sm text-gray-500 font-medium block mb-4">Add Decor</span>

    <div class="flex flex-col gap-2 w-full max-w-[150px]">
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden">

      <button (click)="fileInput.click()" class="w-full px-3 py-2 bg-blue-50 text-blue-600 rounded-md text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm">
        Upload Image
      </button>

      <div class="w-full relative">
        <input 
          type="text" 
          #emojiInput
          maxlength="2"
          placeholder="Type Emoji 😉"
          (keyup.enter)="setEmoji(emojiInput.value)"
          class="w-full px-3 py-2 bg-white border border-gray-200 text-gray-600 rounded-md text-xs text-center font-bold shadow-sm focus:outline-none focus:border-blue-400"
          title="Press Win+. or Cmd+Ctrl+Space to open emoji keyboard"
        >
      </div>
    </div>
  </div>

  <div *ngIf="!isEditing && imageUrl" class="w-full h-full flex items-center justify-center overflow-hidden rounded-xl shadow-sm">
    <img [src]="imageUrl" alt="Custom Sticker" class="object-cover w-full h-full">
  </div>

  <div *ngIf="!isEditing && emoji" class="w-full h-full flex items-center justify-center rounded-xl bg-gradient-to-br from-gray-50 to-gray-100 border border-gray-100 shadow-sm">
    <span class="text-7xl drop-shadow-md">{{ emoji }}</span>
  </div>

  <button
    *ngIf="!isEditing"
    (click)="clearSticker()"
    class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm text-gray-500 p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-md hover:text-red-500 hover:bg-white">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

</div>
