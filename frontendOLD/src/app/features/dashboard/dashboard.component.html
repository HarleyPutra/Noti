<div class="p-3 bg-gray-100 flex gap-3 shadow-sm relative z-10 overflow-x-auto items-center">
  @for (preset of presets; track preset.id) {
    <button
      (click)="selectPreset(preset)"
      [ngClass]="activePresetId === preset.id ? 'bg-blue-500 text-white shadow-md' : 'bg-white text-gray-700 hover:bg-gray-50 shadow-sm'"
      class="px-4 py-2 rounded-md font-medium text-sm transition-colors whitespace-nowrap">
      {{ preset.name }}
    </button>
  }

  <button
    (click)="addPreset()"
    class="px-4 py-2 bg-slate-200 text-slate-700 rounded-md shadow-sm hover:bg-slate-300 font-medium text-sm transition-colors whitespace-nowrap flex items-center gap-1">
    <span>+</span> Add Preset
  </button>
</div>

<gridster [options]="options" class="bg-gray-50 min-h-[calc(100vh-60px)]">
  
  @for (item of dashboard; track item.id) {
    <gridster-item [item]="item">
      
      <div class="h-full w-full bg-white rounded-xl shadow-md p-4 flex flex-col overflow-hidden border border-gray-100 transition-shadow hover:shadow-lg relative group">
        
        <div class="drag-handler cursor-move absolute top-2 left-1/2 -translate-x-1/2 w-12 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-50">
          <div class="w-8 h-1.5 bg-gray-200 rounded-full hover:bg-gray-400 transition-colors"></div>
        </div>

        <div class="gridster-item-content h-full w-full flex flex-col mt-2">
          
          @if (item.type === 'MAIN_EDITOR') {
            <app-editor class="h-full w-full flex flex-col"></app-editor>
          }

          @if (item.type === 'TIMER') {
            <app-timer class="h-full w-full flex flex-col"></app-timer>
          }

          @if (item.type === 'STICKER') {
            <app-sticker class="h-full w-full block p-1"></app-sticker>
          }

          @if (item.type === 'CLOCK') {
            <app-clock class="h-full w-full block p-1"></app-clock>
          }

        </div>

      </div>
    </gridster-item>
  }
</gridster>
