<div class="cursor-move flex items-center justify-between mb-2 pb-2 border-b border-gray-100">
  <input 
    type="text" 
    placeholder="Untitled Note" 
    class="text-xl font-bold text-gray-800 focus:outline-none w-full bg-transparent placeholder-gray-300 pointer-events-none"
  />
  <button class="text-gray-400 hover:text-gray-600 transition-colors">•••</button>
</div>

<div class="flex-1 overflow-y-auto cursor-text">
  <quill-editor
    [(ngModel)]="noteContent"
    [modules]="editorConfig"
    theme="bubble"
    placeholder="Start typing or highlight text for formatting..."
    class="notion-editor">
  </quill-editor>
</div>
