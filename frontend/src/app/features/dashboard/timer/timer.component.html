<h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 text-center">Focus Timer</h3>

<div class="flex-1 flex flex-col items-center justify-center">
  <div *ngIf="!isEditingTime" (click)="isEditingTime = true" class="text-5xl font-mono font-light text-slate-700 cursor-pointer hover:text-blue-500 transition-colors tooltip" title="Click to edit">
    {{ formattedTime }}
  </div>

  <div *ngIf="isEditingTime" class="flex items-center gap-2 mb-2">
    <input 
      type="number" 
      [(ngModel)]="inputMinutes" 
      (keyup.enter)="saveCustomTime()"
      class="w-20 text-center text-3xl font-mono font-light text-slate-700 border-b-2 border-blue-500 focus:outline-none bg-transparent"
    />
    <span class="text-sm text-gray-400 font-bold mt-2">min</span>
    <button (click)="saveCustomTime()" class="mt-2 text-blue-500 hover:text-blue-700">✓</button>
  </div>

  <div class="mt-4 flex gap-2">
    <button
      (click)="toggleTimer()"
      [ngClass]="isRunning ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-green-100 text-green-700 hover:bg-green-200'"
      class="px-4 py-1.5 rounded-full text-sm font-bold transition-colors w-24">
      {{ isRunning ? 'Pause' : 'Start' }}
    </button>

    <button
      (click)="resetTimer()"
      class="bg-gray-100 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-200 transition-colors">
      Reset
    </button>
  </div>
</div>
